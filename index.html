<script>
  let banco = {};
  let preguntasUsadas = {};
  let timerInterval = null;
  let timeLeft = 45;

  // Carga con depuración detallada
  fetch('preguntas.json?nocache=' + Date.now())
    .then(async response => {
      if (!response.ok) {
        throw new Error('No se encuentra el archivo preguntas.json (Error ' + response.status + '). Comprueba el nombre exacto del archivo en GitHub.');
      }
      return response.text();
    })
    .then(texto => {
      try {
        banco = JSON.parse(texto);
        for (const cat in banco) {
          preguntasUsadas[cat] = [];
        }
        document.getElementById('qLabel').innerText = '✅ ¡Preguntas cargadas con éxito! Pulsa cualquier categoría.';
      } catch (errJson) {
        throw new Error('Error de formato en preguntas.json (revisa comas o comillas): ' + errJson.message);
      }
    })
    .catch(err => {
      document.getElementById('qLabel').innerHTML = '<span style="color:#ff5252; font-size:1rem;">⚠️ ' + err.message + '</span>';
    });

  function sacarPregunta(cat, color) {
    if (Object.keys(banco).length === 0) {
      document.getElementById('qLabel').innerText = 'El archivo de preguntas aún no se ha cargado o contiene errores.';
      return;
    }

    const lista = banco[cat];

    if (!lista || !Array.isArray(lista) || lista.length === 0) {
      document.getElementById('catLabel').innerText = cat;
      document.getElementById('catLabel').style.color = color;
      document.getElementById('cardBox').style.borderColor = color;
      document.getElementById('qLabel').innerText = 'No se encontraron preguntas para "' + cat + '". Las categorías disponibles en tu JSON son: ' + Object.keys(banco).join(', ');
      document.getElementById('btnReveal').style.display = 'none';
      document.getElementById('aLabel').style.display = 'none';
      return;
    }

    if (!preguntasUsadas[cat]) preguntasUsadas[cat] = [];

    let disponibles = lista.filter((_, idx) => !preguntasUsadas[cat].includes(idx));
    if (disponibles.length === 0) {
      preguntasUsadas[cat] = [];
      disponibles = lista;
    }

    const item = disponibles[Math.floor(Math.random() * disponibles.length)];
    preguntasUsadas[cat].push(lista.indexOf(item));

    document.getElementById('catLabel').innerText = cat;
    document.getElementById('catLabel').style.color = color;
    document.getElementById('cardBox').style.borderColor = color;
    document.getElementById('qLabel').innerText = item.q;
    document.getElementById('aLabel').innerText = item.a;
    document.getElementById('aLabel').style.display = 'none';
    document.getElementById('btnReveal').style.display = 'block';

    reiniciarTimer();
  }

  function mostrarRespuesta() {
    document.getElementById('btnReveal').style.display = 'none';
    document.getElementById('aLabel').style.display = 'block';
  }

  function reiniciarTimer() {
    clearInterval(timerInterval);
    timeLeft = 45;
    document.getElementById('timerFill').style.width = '100%';
    document.getElementById('timerBtn').innerText = '⏱ Iniciar 45s';
    timerInterval = null;
  }

  function toggleTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      document.getElementById('timerBtn').innerText = '⏱ Reanudar';
    } else {
      document.getElementById('timerBtn').innerText = '⏸ Pausar';
      timerInterval = setInterval(() => {
        timeLeft--;
        const pct = Math.max(0, (timeLeft / 45) * 100);
        document.getElementById('timerFill').style.width = pct + '%';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          document.getElementById('timerBtn').innerText = '⏰ Tiempo';
        }
      }, 1000);
    }
  }
</script>
