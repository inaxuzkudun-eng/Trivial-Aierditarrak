<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Trivial Aierditarrak</title>
  <style>
    :root {
      --geo: #0077b6;
      --esp: #e63946;
      --hist: #f4a261;
      --arte: #7209b7;
      --cie: #2a9d8f;
      --dep: #f77f00;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; height: 100vh; }
    
    .timer-bar { height: 6px; background: #333; border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
    .timer-fill { height: 100%; width: 100%; background: #00e676; transition: width 1s linear; }

    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .cat-btn { border: none; padding: 12px 4px; border-radius: 8px; color: white; font-weight: bold; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
    .cat-geo { background: var(--geo); }
    .cat-esp { background: var(--esp); }
    .cat-hist { background: var(--hist); color: #000; }
    .cat-arte { background: var(--arte); }
    .cat-cie { background: var(--cie); }
    .cat-dep { background: var(--dep); }

    .card { background: var(--card-bg); border-radius: 16px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; border: 2px solid #333; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .card-category { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; letter-spacing: 1px; }
    .question { font-size: 1.25rem; font-weight: 600; line-height: 1.4; margin-bottom: 24px; }
    .answer-box { min-height: 48px; display: flex; align-items: center; justify-content: center; width: 100%; }
    .reveal-btn { background: #333; color: #fff; border: 1px solid #555; padding: 12px 20px; border-radius: 20px; font-size: 1rem; cursor: pointer; }
    .answer { font-size: 1.15rem; color: #00e676; font-weight: 700; display: none; }

    .controls { margin-top: 16px; display: flex; gap: 8px; }
    .btn-action { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; background: #222; border: 1px solid #444; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>

  <div class="category-grid">
    <button class="cat-btn cat-geo" onclick="sacarPregunta('Geografía', '#0077b6')">GEOGRAFÍA</button>
    <button class="cat-btn cat-esp" onclick="sacarPregunta('Espectáculos', '#e63946')">ESPECTÁCULOS</button>
    <button class="cat-btn cat-hist" onclick="sacarPregunta('Historia', '#f4a261')">HISTORIA</button>
    <button class="cat-btn cat-arte" onclick="sacarPregunta('Arte y Lit.', '#7209b7')">ARTE/LIT.</button>
    <button class="cat-btn cat-cie" onclick="sacarPregunta('Ciencias', '#2a9d8f')">CIENCIA</button>
    <button class="cat-btn cat-dep" onclick="sacarPregunta('Deportes', '#f77f00')">DEPORTES</button>
  </div>

  <div class="card" id="cardBox">
    <div class="card-category" id="catLabel">ELIGE UNA CATEGORÍA</div>
    <div class="question" id="qLabel">Toca cualquier categoría para empezar</div>
    <div class="answer-box">
      <button class="reveal-btn" id="btnReveal" style="display:none;" onclick="mostrarRespuesta()">Ver Respuesta</button>
      <div class="answer" id="aLabel"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-action" id="timerBtn" onclick="toggleTimer()">⏱ Iniciar 45s</button>
  </div>

  <script>
    let banco = {};
    let preguntasUsadas = {};
    let timerInterval = null;
    let timeLeft = 45;

    fetch('preguntas.json?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        banco = data;
        for (const cat in banco) {
          preguntasUsadas[cat] = [];
        }
      })
      .catch(err => {
        document.getElementById('qLabel').innerText = 'Error al cargar preguntas.json';
      });

    function normalizarClave(cat) {
      if (banco[cat]) return cat;
      const clean = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      const target = clean(cat);
      for (const k in banco) {
        if (clean(k) === target || clean(k).startsWith(target) || target.startsWith(clean(k))) {
          return k;
        }
      }
      return cat;
    }

    function sacarPregunta(categoriaOriginal, color) {
      const cat = normalizarClave(categoriaOriginal);
      const lista = banco[cat] || [];

      if (!lista || lista.length === 0) {
        document.getElementById('catLabel').innerText = categoriaOriginal;
        document.getElementById('catLabel').style.color = color;
        document.getElementById('cardBox').style.borderColor = color;
        document.getElementById('qLabel').innerText = 'No hay preguntas disponibles en ' + categoriaOriginal + '.';
        document.getElementById('btnReveal').style.display = 'none';
        document.getElementById('aLabel').style.display = 'none';
        return;
      }

      if (!preguntasUsadas[cat]) preguntasUsadas[cat] = [];

      let disponibles = lista.filter((_, idx) => !preguntasUsadas[cat].includes(idx));
      if (disponibles.length === 0) {
        preguntasUsadas[cat] = [];
        disponibles = lista;
      }

      const item = disponibles[Math.floor(Math.random() * disponibles.length)];
      preguntasUsadas[cat].push(lista.indexOf(item));

      document.getElementById('catLabel').innerText = categoriaOriginal;
      document.getElementById('catLabel').style.color = color;
      document.getElementById('cardBox').style.borderColor = color;
      document.getElementById('qLabel').innerText = item.q;
      document.getElementById('aLabel').innerText = item.a;
      document.getElementById('aLabel').style.display = 'none';
      document.getElementById('btnReveal').style.display = 'block';

      reiniciarTimer();
    }

    function mostrarRespuesta() {
      document.getElementById('btnReveal').style.display = 'none';
      document.getElementById('aLabel').style.display = 'block';
    }

    function reiniciarTimer() {
      clearInterval(timerInterval);
      timeLeft = 45;
      document.getElementById('timerFill').style.width = '100%';
      document.getElementById('timerBtn').innerText = '⏱ Iniciar 45s';
      timerInterval = null;
    }

    function toggleTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById('timerBtn').innerText = '⏱ Reanudar';
      } else {
        document.getElementById('timerBtn').innerText = '⏸ Pausar';
        timerInterval = setInterval(() => {
          timeLeft--;
          const pct = Math.max(0, (timeLeft / 45) * 100);
          document.getElementById('timerFill').style.width = pct + '%';
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timerBtn').innerText = '⏰ Tiempo';
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
